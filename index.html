<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>开端</title>
<script src="delivery.js?v=8"></script>
<script src="mobile.js?v=6"></script>
<link rel="stylesheet" href="game.css?v=7">

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none}
body{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;color:#f6e3b4;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
img{-webkit-user-drag:none;user-select:none}

/* 舞台：本地坐标系；手机竖屏可强制旋转为横屏 */
#app{position:fixed;left:0;top:0;overflow:hidden;background:#000;container-type:size;transform-origin:0 0}
.scene{position:absolute;inset:0;overflow:hidden}
.off{display:none!important}
.px{position:absolute;inset:0;pointer-events:none;will-change:transform}
.box{position:absolute}

/* ================= 开场 / 大厅 ================= */
#cam{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
#world #bgImg{position:absolute;inset:0;width:100%;height:100%;filter:brightness(.4) saturate(.9) blur(2px)}
#hot{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#hot.on{pointer-events:auto}
.tbl{fill:rgba(255,215,140,0);stroke:rgba(255,226,160,0);stroke-width:1.6;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .5s,stroke .5s,filter .5s;pointer-events:none}
#hot.on .tbl{pointer-events:all}
.tbl.hover,.tbl.ping{fill:url(#hotFill);stroke:rgba(255,232,170,.95);filter:drop-shadow(0 0 6px rgba(255,200,100,.9))}
#tblTag{position:absolute;transform:translate(-50%,-100%);pointer-events:none;opacity:0;transition:opacity .4s,transform .5s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;align-items:center}
#tblTag.on{opacity:1;transform:translate(-50%,calc(-100% - 6px))}
#tblTag b{font:400 clamp(16px,2.3cqh,26px)/1 "Ma Shan Zheng","KaiTi",serif;writing-mode:vertical-rl;letter-spacing:.35em;color:#fff1cc;text-shadow:0 0 12px rgba(255,190,90,.9),0 2px 4px #000;padding:.35em .25em;background:radial-gradient(ellipse at 50% 50%,rgba(40,8,2,.6),transparent 70%)}
#tblTag i{width:1px;height:clamp(18px,3.4cqh,40px);background:linear-gradient(#ffe3a0,transparent)}
#fgCam{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform,opacity}
#fg{position:absolute;opacity:0;filter:blur(1.4px) saturate(1.05)}
#fg img{width:100%;height:100%;display:block}
#shafts{position:absolute;inset:0;opacity:0;mix-blend-mode:screen;pointer-events:none;
  background:
   linear-gradient(105deg,transparent 18%,rgba(255,214,140,.16) 24%,transparent 31%),
   linear-gradient(98deg,transparent 40%,rgba(255,225,160,.12) 46%,transparent 52%),
   linear-gradient(80deg,transparent 58%,rgba(255,206,130,.14) 64%,transparent 71%),
   radial-gradient(ellipse 60% 45% at 50% 20%,rgba(255,215,140,.22),transparent 70%);
  animation:shaft 9s ease-in-out infinite alternate}
@keyframes shaft{from{filter:brightness(.8)}to{filter:brightness(1.25)}}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 48%,transparent 55%,rgba(8,2,0,.55) 85%,rgba(0,0,0,.85))}
#dark{position:absolute;inset:0;background:#000;opacity:.35;pointer-events:none}
.front{position:absolute;top:-5%;bottom:-5%;width:22cqw;transform:translateX(-50%);opacity:0;mix-blend-mode:screen;pointer-events:none;
  background:radial-gradient(ellipse 50% 60% at 50% 50%,rgba(255,226,150,.85),rgba(255,180,80,.35) 40%,transparent 72%);filter:blur(6px)}

#pxCurt{z-index:10}
.curtain{position:absolute;top:0;height:100%;width:51.6cqw}
.curtain.l{left:0;z-index:2}
.curtain.r{right:0;z-index:1}
.drop{position:absolute;inset:0;transform:translateY(-135%)}
.sway{position:absolute;inset:0;transform-origin:50% 0;animation:breathe 7s ease-in-out infinite}
.r .sway{animation-delay:-3.2s}
@keyframes breathe{0%,100%{transform:skewX(0) scaleY(1)}50%{transform:skewX(.35deg) scaleY(1.004)}}
.cimg{position:absolute;background:var(--img-curtain) center/100% 100% no-repeat;filter:drop-shadow(0 18px 30px rgba(0,0,0,.7))}
.l .cimg{right:0}
.r .cimg{left:0;transform:scaleX(-1)}
.cimg::after{content:"";position:absolute;left:0;right:0;top:0;bottom:22%;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.35),transparent 18%,transparent 74%,rgba(20,0,0,.55) 97%,rgba(0,0,0,.75))}
#seamGlow{position:absolute;left:50%;top:-5%;bottom:-5%;width:12cqw;transform:translateX(-50%) scaleX(.2);opacity:0;z-index:3;mix-blend-mode:screen;pointer-events:none;
  background:radial-gradient(ellipse 18% 48% at 50% 44%,rgba(255,250,225,1),rgba(255,226,150,0) 100%),
    radial-gradient(ellipse 50% 58% at 50% 42%,rgba(255,220,140,.9),rgba(255,170,70,.45) 38%,rgba(160,60,10,0) 76%);filter:blur(7px)}

#pxRays{z-index:12}
#rays{position:absolute;left:50%;top:42%;width:240cqmax;height:240cqmax;margin:-120cqmax 0 0 -120cqmax;opacity:0;mix-blend-mode:screen;filter:blur(3px);
  background:repeating-conic-gradient(from 0deg,rgba(255,214,130,0) 0deg,rgba(255,226,160,.30) 4deg,rgba(255,214,130,0) 9deg,rgba(255,214,130,0) 13deg);
  -webkit-mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 14%,transparent 42%);mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 14%,transparent 42%);
  animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#flash{position:absolute;inset:0;z-index:30;opacity:0;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(ellipse 60% 60% at 50% 45%,rgba(255,248,225,1),rgba(255,210,120,.65) 40%,rgba(255,170,60,0) 80%)}

#pxBeauty{z-index:17}
#pxBeauty.behind{z-index:13}
#beauty{position:absolute;height:min(66cqh,105cqw);aspect-ratio:2/3;top:-5cqh;left:48%;translate:-46% 0;opacity:0;transform-origin:50% 0}
#beauty img,#pov img{width:100%;height:100%;display:block;pointer-events:none}
#beauty img{-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 26%);mask-image:linear-gradient(to bottom,transparent 0%,#000 26%);filter:drop-shadow(0 20px 26px rgba(0,0,0,.55))}
#pxPov{z-index:15}
#pov{position:absolute;height:min(80cqh,125cqw);aspect-ratio:2/3;bottom:-12cqh;left:60%;translate:-55% 0;transform:translateY(110%);transform-origin:50% 100%}
#pov img{filter:drop-shadow(0 -10px 30px rgba(0,0,0,.5))}
#palmGlow{position:absolute;width:44%;aspect-ratio:1;left:47%;top:50.5%;translate:-50% -50%;border-radius:50%;opacity:0;mix-blend-mode:screen;pointer-events:none;
  background:radial-gradient(circle,rgba(255,236,180,.95),rgba(255,190,90,.35) 40%,transparent 70%)}

#coin{position:absolute;left:0;top:0;z-index:16;width:40px;height:40px;opacity:0;pointer-events:none;will-change:transform;
  filter:drop-shadow(0 0 10px rgba(255,205,110,.75)) drop-shadow(0 6px 10px rgba(0,0,0,.45))}
#ring{position:absolute;left:0;top:0;z-index:16;width:40px;height:40px;opacity:0;pointer-events:none}
#ring::after,#ring::before{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 1px rgba(255,226,160,.9),0 0 22px rgba(255,200,100,.7);opacity:0}
#ring.on::after{animation:ring 1.8s ease-out infinite}
#ring.on::before{animation:ring 1.8s .9s ease-out infinite}
@keyframes ring{0%{opacity:.9;scale:.9}100%{opacity:0;scale:2.2}}
.shock{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none;z-index:18;border:2px solid rgba(255,230,170,.95);box-shadow:0 0 18px rgba(255,200,100,.9),inset 0 0 14px rgba(255,210,120,.6)}
.streak{position:absolute;left:0;top:0;height:3px;pointer-events:none;z-index:18;border-radius:50%;mix-blend-mode:screen;
  background:linear-gradient(90deg,transparent,rgba(255,220,150,.9) 30%,#fffbea 50%,rgba(255,220,150,.9) 70%,transparent);box-shadow:0 0 14px rgba(255,200,110,.9)}
#dust{position:absolute;inset:0;z-index:20;pointer-events:none}
#blink{position:absolute;inset:0;z-index:35;background:#000;opacity:0;pointer-events:none}

/* ================= 入座 ================= */
#scSeat{z-index:2}
#seatBox{will-change:transform,filter}
.lyr{position:absolute;inset:0;will-change:transform;pointer-events:none}
#seatBg{position:absolute;inset:-5%;background:var(--img-seat) center/cover no-repeat;filter:blur(1.5px) brightness(.92);transition:filter 1.2s}
#seatBg.focusFar{filter:blur(4px) brightness(.8)}
.bokeh{position:absolute;border-radius:50%;mix-blend-mode:screen;pointer-events:none;
  background:radial-gradient(circle,rgba(255,226,160,.55),rgba(255,190,90,.18) 55%,transparent 70%);animation:bok 9s ease-in-out infinite alternate}
@keyframes bok{from{transform:translate(0,0) scale(1);opacity:.5}to{transform:translate(1.5%,-3%) scale(1.15);opacity:1}}
#cat{position:absolute;height:98%;aspect-ratio:2/3;left:49.6%;top:4%;transform-origin:50% 92%;cursor:pointer;transition:filter 1.2s;pointer-events:auto}
#cat.soft{filter:blur(1.6px) brightness(.85)}
#catInner{position:absolute;inset:0;transform-origin:50% 92%;animation:catBreath 4.6s ease-in-out infinite}
@keyframes catBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.004,1.009) translateY(-.15%)}}
#catImg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(-18px 24px 30px rgba(0,0,0,.5))}
#catRim{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.55;
  background:radial-gradient(ellipse 40% 30% at 70% 16%,rgba(255,200,120,.35),transparent 70%),radial-gradient(ellipse 30% 20% at 50% 30%,rgba(255,230,180,.2),transparent 70%);animation:rim 6s ease-in-out infinite alternate}
@keyframes rim{to{opacity:.9}}
.flick{position:absolute;width:5.2%;aspect-ratio:2/3;left:56%;top:33%;border-radius:8%;background:var(--img-cback) center/cover;box-shadow:0 0 0 1px rgba(255,220,150,.6),0 4px 8px rgba(0,0,0,.4);opacity:0;pointer-events:none;transform-style:preserve-3d}
#tableImg{position:absolute;width:120%;left:-56.4%;top:25%;aspect-ratio:3/2;filter:drop-shadow(0 -8px 30px rgba(0,0,0,.45)) brightness(.98);transition:filter 1.2s}
#tableImg.dim{filter:drop-shadow(0 -8px 30px rgba(0,0,0,.45)) brightness(.86) blur(1px)}
#nearBokeh .bokeh{filter:blur(4px)}

#nameTag{position:absolute;left:88%;top:21%;display:flex;gap:.5em;align-items:flex-start;opacity:0;pointer-events:none;font-size:calc(var(--bh) * .012)}
#nameTag.on{animation:nameIn 1.6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes nameIn{from{opacity:0;transform:translateY(-14px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
#nameTag .nm{writing-mode:vertical-rl;font:400 calc(var(--bh) * .056)/1 "Ma Shan Zheng","KaiTi",serif;letter-spacing:.12em;
  background:linear-gradient(180deg,#fff6dc,#f0c873 45%,#b07a2c 70%,#ffe7b0);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 2px rgba(40,10,0,.9)) drop-shadow(0 0 14px rgba(255,180,80,.5))}
#nameTag .side{display:flex;flex-direction:column;align-items:center;gap:.8em;padding-top:.6em}
#nameTag .rl{width:1px;height:calc(var(--bh) * .09);background:linear-gradient(#f3d38a,transparent)}
#nameTag .tt{writing-mode:vertical-rl;font-size:calc(var(--bh) * .016);letter-spacing:.6em;color:#e9cf98;text-shadow:0 1px 3px #000}
#nameTag .seal{width:calc(var(--bh) * .036);height:calc(var(--bh) * .036);display:grid;place-items:center;font:400 calc(var(--bh) * .024)/1 "Ma Shan Zheng","KaiTi",serif;color:#ffe9d0;
  background:radial-gradient(circle at 40% 35%,#d4322a,#8e0f0c);border-radius:3px;box-shadow:0 0 0 1px rgba(255,200,170,.35),0 2px 6px rgba(0,0,0,.6);transform:rotate(-6deg)}

/* 气泡（散落排布，有远近） */
.talk{position:absolute;inset:0;pointer-events:none}
.talk svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lead{fill:none;stroke:url(#leadGrad);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;animation:lead .9s cubic-bezier(.3,.7,.2,1) forwards;transition:opacity .8s}
.leadDot{fill:#ffe4a6;filter:drop-shadow(0 0 4px #ffb84d);transition:opacity .8s}
.lead.old,.leadDot.old{opacity:.18}
@keyframes lead{to{stroke-dashoffset:0}}
.bub{position:absolute;font:400 calc(var(--bh) * var(--fs) / 100)/1.35 "Ma Shan Zheng","STXingkai","KaiTi",serif;color:#fff2d6;letter-spacing:.06em;white-space:nowrap;
  transform:rotate(var(--rot));transform-origin:0 0;transition:opacity 1s,filter 1s,transform 1s;
  text-shadow:0 0 calc(var(--bh) * .012) rgba(255,170,70,.55),0 2px 3px rgba(20,4,0,.95)}
.bub.v{writing-mode:vertical-rl;letter-spacing:.12em}
.bub::before{content:"";position:absolute;inset:-34% -26%;z-index:-1;border-radius:46% 54% 42% 58%/55% 40% 60% 45%;filter:blur(calc(var(--bh) * .014));
  background:radial-gradient(ellipse at 50% 50%,rgba(38,6,3,.72),rgba(60,10,4,.42) 52%,transparent 74%)}
.bub .ln{display:block}
.bub i{font-style:normal;display:inline-block;opacity:0;animation:inkIn .75s calc(var(--k) * 52ms) cubic-bezier(.2,.8,.2,1) forwards}
@keyframes inkIn{from{opacity:0;filter:blur(7px);transform:translateY(.25em) scale(1.2);color:#ffd27a}to{opacity:1;filter:none;transform:none}}
.bub.big{color:#fff6e0;text-shadow:0 0 calc(var(--bh) * .02) rgba(255,160,60,.7),0 3px 4px rgba(30,4,0,.95)}
.bub.big::after{content:"";position:absolute;z-index:-1;left:-12%;right:-12%;top:-4%;bottom:-4%;border-radius:40%;
  background:linear-gradient(180deg,transparent,rgba(170,20,14,.38) 30%,rgba(140,10,8,.5) 60%,transparent);filter:blur(calc(var(--bh) * .008));opacity:0;animation:fadeIn 1.2s .2s forwards}
.bub.small{color:#f0d9a8}
.bub.old{opacity:.4;filter:blur(1px);transform:rotate(var(--rot)) scale(.93)}
.bub .stamp{display:inline-grid;place-items:center;width:1.05em;height:1.05em;margin:.35em .1em 0;font-size:.42em;color:#ffe9d2;background:radial-gradient(circle at 40% 35%,#d63a2e,#8b0e0b);border-radius:2px;
  box-shadow:0 0 0 1px rgba(255,200,170,.35);opacity:0;transform:scale(2.2) rotate(-12deg);animation:stampIn .45s 1.1s cubic-bezier(.3,1.6,.5,1) forwards;writing-mode:horizontal-tb}
@keyframes stampIn{to{opacity:1;transform:scale(1) rotate(-8deg)}}
@keyframes fadeIn{to{opacity:1}}

/* 「是」筹码 */
#chipLyr{perspective:1500px;perspective-origin:30% 38%}
#chip{position:absolute;left:24%;top:82%;width:calc(var(--bh) * .16);aspect-ratio:1;translate:-50% -50%;transform-style:preserve-3d;transform:rotateX(66deg);opacity:0;pointer-events:none;cursor:pointer}
#chip.on{pointer-events:auto}
#chip .disc{position:absolute;inset:0;border-radius:50%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.8,.2,1);
  background:
    radial-gradient(circle,transparent 57%,#f6dc96 57.5%,#b17a2d 60%,transparent 60.5%),
    radial-gradient(circle at 42% 36%,#e2483a,#a3150f 52%,#5e0705 100%);
  box-shadow:0 0 0 calc(var(--bh) * .009) #7a0c08,0 0 0 calc(var(--bh) * .011) #f0cf84,0 18px 26px rgba(0,0,0,.55)}
#chip .disc::before{content:"";position:absolute;inset:-4%;border-radius:50%;z-index:-1;
  background:repeating-conic-gradient(#f7e2ad 0 10deg,#8f130e 10deg 30deg);-webkit-mask:radial-gradient(circle,transparent 66%,#000 67%);mask:radial-gradient(circle,transparent 66%,#000 67%)}
#chip .disc b{position:absolute;inset:0;display:grid;place-items:center;font:400 calc(var(--bh) * .1)/1 "Ma Shan Zheng","KaiTi",serif;
  background:linear-gradient(180deg,#fffaf0,#f6d58a 55%,#c98d35);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 1px rgba(60,0,0,.8))}
#chip .halo{position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(circle,rgba(255,215,130,.45),transparent 62%);animation:halo 2s ease-in-out infinite;transform:translateZ(-1px)}
@keyframes halo{50%{opacity:.35;transform:translateZ(-1px) scale(1.15)}}
#chip:hover .disc,#chip.hover .disc{transform:translateZ(18px) rotateZ(12deg)}
#chipNote{position:absolute;left:15%;top:56%;writing-mode:vertical-rl;font:400 calc(var(--bh) * .026)/1 "Ma Shan Zheng","KaiTi",serif;letter-spacing:.5em;color:#f3dca8;opacity:0;transform:rotate(-4deg);
  text-shadow:0 0 10px rgba(255,170,70,.6),0 2px 3px #000;pointer-events:none}
.inkRing{position:absolute;border-radius:50%;pointer-events:none;border:3px solid rgba(214,50,40,.85);box-shadow:0 0 20px rgba(214,50,40,.6)}

/* ================= 俯视桌面 ================= */
#scTop{z-index:3;perspective:1100px;perspective-origin:50% 38%}
#topTilt{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
#topPlane{transform-style:preserve-3d;transform-origin:50% 100%}
#topImg{position:absolute;inset:0;width:100%;height:100%;display:block}
#topLight{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(ellipse 45% 40% at 50% 42%,rgba(255,220,150,.22),transparent 70%);animation:topLight 7s ease-in-out infinite alternate}
@keyframes topLight{to{transform:translate(4%,2%) scale(1.1)}}
#topVig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 70% at 50% 46%,transparent 50%,rgba(0,0,0,.6))}
.item{position:absolute;transform-style:preserve-3d;width:0;height:0}
.lift{position:absolute;left:0;top:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.body{position:absolute;transform-style:preserve-3d;cursor:pointer}
.item.hover .lift{transform:translateZ(calc(var(--pw) * .02))}
.shadow{position:absolute;pointer-events:none;background:rgba(0,0,0,.55);filter:blur(calc(var(--pw) * .006));transition:opacity .6s}
.card{width:calc(var(--pw) * .088);aspect-ratio:2/3;left:calc(var(--pw) * -.044);top:calc(var(--pw) * -.066)}
.card .face{position:absolute;inset:0;border-radius:6%;backface-visibility:hidden;-webkit-backface-visibility:hidden;background-size:cover;background-position:center;
  box-shadow:0 0 0 1px rgba(255,226,160,.7),inset 0 0 0 2px rgba(80,10,4,.25)}
.card .cb{background-image:var(--img-cback)}
.card .cf{background-image:var(--img-cfront);transform:rotateY(180deg)}
.card .gl{position:absolute;inset:0;border-radius:6%;pointer-events:none;backface-visibility:hidden;background:linear-gradient(115deg,transparent 35%,rgba(255,250,230,.55) 48%,transparent 60%);background-size:250% 100%;animation:glint 3.6s ease-in-out infinite}
@keyframes glint{0%,60%{background-position:130% 0}100%{background-position:-130% 0}}
.gunWrap{width:calc(var(--pw) * .25);aspect-ratio:1024/683;left:calc(var(--pw) * -.125);top:calc(var(--pw) * -.0834)}
.gunWrap img{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 0 1px rgba(255,220,150,.6))}
.gunShadow{width:calc(var(--pw) * .25);aspect-ratio:1024/683;left:calc(var(--pw) * -.125);top:calc(var(--pw) * -.0834);background:none!important;filter:brightness(0) blur(5px);opacity:.55}
.gunShadow img{width:100%;height:100%;display:block}
.diceSet{width:0;height:0}
.die{position:absolute;width:var(--ds);height:var(--ds);left:calc(var(--ds) * -.5);top:calc(var(--ds) * -.5);transform-style:preserve-3d}
.die .f{position:absolute;inset:0;border-radius:16%;background:var(--img-die) center/cover;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:16%;
  box-shadow:inset 0 0 calc(var(--ds) * .12) rgba(140,100,40,.35),0 0 0 1px rgba(200,160,80,.5);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.die .f1{transform:translateZ(calc(var(--ds) / 2))}
.die .f6{transform:rotateY(180deg) translateZ(calc(var(--ds) / 2))}
.die .f3{transform:rotateY(90deg) translateZ(calc(var(--ds) / 2))}
.die .f4{transform:rotateY(-90deg) translateZ(calc(var(--ds) / 2))}
.die .f2{transform:rotateX(90deg) translateZ(calc(var(--ds) / 2))}
.die .f5{transform:rotateX(-90deg) translateZ(calc(var(--ds) / 2))}
.pip{width:70%;height:70%;place-self:center;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#7a6656,#20150e 55%,#000 92%);box-shadow:inset 0 1px 1px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.5)}
.f1 .pip,.f4 .pip{background:radial-gradient(circle at 36% 30%,#ff9a86,#c0181e 48%,#5b0306 92%)}
.f1 .pip{width:118%;height:118%}
.dieShadow{width:var(--ds);height:var(--ds);left:calc(var(--ds) * -.5);top:calc(var(--ds) * -.5);border-radius:18%}
.label{position:absolute;pointer-events:none;opacity:0;transition:opacity .8s,transform .8s;display:flex;gap:.45em;align-items:flex-start}
.label.on{opacity:.62}
.item.hover ~ .label.on,.label.hi{opacity:1}

#ui{position:absolute;inset:0;z-index:55;pointer-events:none}
#caption{position:absolute;left:50%;bottom:8.5cqh;transform:translateX(-50%);white-space:nowrap;font-size:clamp(13px,1.55cqw,22px);letter-spacing:.32em;
  color:#f7e6bd;text-shadow:0 0 18px rgba(255,190,90,.55),0 2px 6px rgba(0,0,0,.9);opacity:0;transition:opacity .7s,filter .7s;filter:blur(6px)}
#caption.on{opacity:1;filter:blur(0)}
#hint{position:absolute;left:50%;bottom:4cqh;transform:translateX(-50%);display:flex;white-space:nowrap;align-items:center;gap:14px;font-size:clamp(11px,1.05cqw,15px);letter-spacing:.5em;color:#e9c97f;opacity:0;transition:opacity .6s;text-shadow:0 1px 4px #000}
#hint.on{opacity:1;animation:breath 2.2s ease-in-out infinite}
#hint::before,#hint::after{content:"";width:46px;height:1px;background:linear-gradient(90deg,transparent,#e2be72)}
#hint::after{transform:scaleX(-1)}
@keyframes breath{50%{opacity:.45}}
#frame{position:absolute;inset:clamp(10px,1.4cqw,22px);pointer-events:none;opacity:0;transition:opacity 2s}
#frame.on{opacity:1}
#frame i{position:absolute;width:42px;height:42px;border:1px solid rgba(235,198,120,.6)}
#frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
#frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
#frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
#frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
#tools{position:absolute;right:clamp(14px,2cqw,30px);top:clamp(12px,2cqw,26px);display:flex;gap:8px;pointer-events:auto}
.tbtn{font:inherit;font-size:12px;letter-spacing:.3em;padding:8px 10px 8px 13px;color:#e6cb92;background:rgba(10,4,0,.4);border:1px solid rgba(230,190,110,.35);cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#changeRuleBtn{min-height:44px;letter-spacing:.16em;background:linear-gradient(135deg,rgba(94,54,12,.86),rgba(17,10,4,.9));border-color:#c89b4d;box-shadow:inset 0 0 16px #e9ba5420,0 3px 18px #0006;color:#ffe6ae}
#changeRuleBtn:focus-visible{outline:2px solid #ffe4a4;outline-offset:3px}
.tbtn:hover{border-color:rgba(255,215,140,.8);color:#fff1cc}
.tbtn.hl{border-color:rgba(255,215,140,.85);color:#fff1cc;box-shadow:0 0 14px rgba(255,190,90,.45)}
.btn{position:relative;font:inherit;cursor:pointer;color:#fff3d2;letter-spacing:.7em;padding:14px 26px 14px calc(26px + .7em);font-size:clamp(14px,1.2cqw,17px);
  background:linear-gradient(180deg,rgba(120,30,12,.55),rgba(50,10,4,.65));border:1px solid rgba(240,200,120,.85);

#loader{position:absolute;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 45%,#1d0a04,#000 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity 1s}
#loader.hide{opacity:0;pointer-events:none}
.ld-coin{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#e2b25a 40%,#8a5a1c 80%);box-shadow:0 0 30px rgba(255,190,90,.45);animation:flip 1.6s linear infinite}
@keyframes flip{to{transform:rotateY(360deg)}}
.ld-text{font-size:13px;letter-spacing:.5em;color:#cfae6c}
#startBtn{display:none}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#rotMask{position:absolute;inset:0;z-index:60;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}

function caption(t){ clearTimeout(capTimer); el.caption.classList.remove('on'); if (!t) return; capTimer = setTimeout(() => { el.caption.textContent = t; el.caption.classList.add('on'); }, 450); }
function hint(t){ if (!t){ el.hint.classList.remove('on'); return; } el.hint.textContent = t; el.hint.classList.add('on'); }
let waitRes = null;
function waitTap(text, auto){
  hint(text);
  return new Promise(res => { const me = () => { waitRes = null; hint(''); res(); }; waitRes = me; sleep(auto).then(() => { if (waitRes === me) me(); }); });
}

/* ================= 开场：揭幕 ================= */
function setReveal(p){
  const SP = 15, h = p*(50 + SP);
  const L1 = 50 - h, L2 = Math.min(50, L1 + SP), R2 = 50 + h, R1 = Math.max(50, R2 - SP);
  const m = `linear-gradient(90deg,#000 0%,#000 ${L1}%,transparent ${L2}%,transparent ${R1}%,#000 ${R2}%,#000 100%)`;
  el.dark.style.webkitMaskImage = m; el.dark.style.maskImage = m; el.dark.style.opacity = 1;
  const fo = Math.sin(Math.PI*Math.min(1, p*1.05));
  el.frontL.style.left = (L1 + L2)/2 + '%'; el.frontR.style.left = (R1 + R2)/2 + '%'; el.frontL.style.opacity = el.frontR.style.opacity = fo;
  hallZoom = 1.16 - .16*p; setCam(hallZoom);
  el.bgImg.style.filter = `brightness(${.3 + .72*p}) saturate(${.85 + .25*p}) blur(${(1 - p)*2}px)`;
  el.fg.style.opacity = p;
  el.curtL.style.transform = `translateX(calc(-3.4cqw - ${p*104}%)) skewX(${-p*4}deg)`;
  el.curtR.style.transform = `translateX(calc(3.4cqw + ${p*104}%)) skewX(${p*4}deg)`;
  el.rays.style.opacity = Math.max(0, 1 - p*1.3);
  el.seamGlow.style.opacity = Math.max(0, 1 - p*1.6);
  el.seamGlow.style.transform = `translateX(-50%) scaleX(${1.6 + p*4})`;
  dustLevel = .45 + .55*p;
}
function tween(dur, fn, tok){ return new Promise(res => { const t0 = CLOCK; const st = () => { if (tok !== TOK) return res(); const t = Math.min(1, (CLOCK - t0)/dur); fn(t); t < 1 ? requestAnimationFrame(st) : res(); }; requestAnimationFrame(st); }); }

async function walkTo(p){
  SCENE = 'walk'; hint(''); el.hot.classList.remove('on'); tag.classList.remove('on');
  p.classList.add('hover'); setTimeout(() => p.classList.remove('hover'), 900);
  parallaxOn = false;
  const b = p.getBBox();
  const cxw = p.dataset.tx ? +p.dataset.tx : b.x + b.width/2, cyw = p.dataset.ty ? +p.dataset.ty : b.y + b.height*.45;
  const P = { x:WB.x + cxw/1568*WB.w, y:WB.y + cyw/882*WB.h };     // cam 前的坐标
  const S0 = cam.s, X0 = cam.x, Y0 = cam.y, Sx = +p.dataset.s;
  const C = { x:W/2, y:H*.6 };
  const start = { x:X0 + S0*P.x, y:Y0 + S0*P.y };
  const steps = Sx > 3 ? 7 : Sx > 2 ? 5 : 3, dur = 1100 + steps*480;
  let lastStep = -1;
  sfx.step(.6);
  await tween(dur, t => {
    const e = ease.sine(t);
    const s = lerp(S0, Sx, e);
    const sx = lerp(start.x, C.x, e), sy = lerp(start.y, C.y, e);
    const ph = t*steps, env = Math.sin(Math.PI*Math.min(1, t*1.15));
    const bobY = -Math.abs(Math.sin(ph*Math.PI))*H*.016*env + H*.008*env;
    const bobX = Math.sin(ph*Math.PI)*W*.004*env;
    const roll = Math.sin(ph*Math.PI)*.55*env;
    setCamRaw(s, sx - s*P.x + bobX, sy - s*P.y + bobY, roll);
    const st = Math.floor(ph + .5); if (st !== lastStep){ lastStep = st; if (st > 0 && st <= steps) sfx.step(.8 + Math.random()*.3); }
    el.fgCam.style.transform = `scale(${1 + (s - 1)*1.7}) translate(${(W/2 - P.x)*e*.25}px,${(H/2 - P.y)*e*.15}px)`;
    el.fgCam.style.opacity = 1 - clamp01(e*1.6);
    el.bgImg.style.filter = `brightness(${1.02 - e*.25}) saturate(1.1) blur(${Math.pow(e, 3)*3}px)`;
    el.blink.style.opacity = clamp01((t - .8)/.2);
  }, TOK);
  // 落座：视线下沉，眨眼
  sfx.sit();
  await sleep(250);
  enterSeat();
}

function say(layer, s, from){
  const b = document.createElement('div');
  b.className = 'bub' + (s.v ? ' v' : '') + (s.big ? ' big' : '') + (s.cls ? ' ' + s.cls : '');
  b.style.left = s.x + '%'; b.style.top = s.y + '%'; b.style.setProperty('--fs', s.size); b.style.setProperty('--rot', (s.rot || 0) + 'deg');
  let k = 0;
  b.innerHTML = s.t.split('\n').map(L => '<span class="ln">' + [...L].map(c => `<i style="--k:${k++}">${c}</i>`).join('') + '</span>').join('')
    + (s.stamp ? `<span class="stamp">${s.stamp}</span>` : '');
  layer.querySelectorAll('.bub,.lead,.leadDot').forEach(o => o.classList.add('old'));
  layer.appendChild(b);
  if (from){
    const svg = layer.querySelector('svg'), lr = rectL(layer), br = rectL(b);
    const bx = clamp01((from.x/100*lr.width + lr.left - br.left)/br.width), by = clamp01((from.y/100*lr.height + lr.top - br.top)/br.height);
    const ex = (br.left + br.width*bx - lr.left)/lr.width*1000, ey = (br.top + br.height*by - lr.top)/lr.height*1000;
    const fx = from.x*10, fy = from.y*10, mxp = (fx + ex)/2, myp = (fy + ey)/2;
    const dx = ex - fx, dy = ey - fy, n = Math.hypot(dx, dy) || 1, bend = .22*n;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M${fx + dx*.08},${fy + dy*.08} Q${mxp - dy/n*bend},${myp + dx/n*bend} ${ex},${ey}`);
    path.setAttribute('class', 'lead'); path.setAttribute('pathLength', '1'); svg.appendChild(path);
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); dot.setAttribute('cx', ex); dot.setAttribute('cy', ey); dot.setAttribute('r', 3.5); dot.setAttribute('class', 'leadDot'); svg.appendChild(dot);
  }
  sfx.pop();
  return b;
}

      document.getElementById('loadPercent').innerHTML = pct+'<small>%</small>';
      el.ldText.textContent = '已就绪 '+state.done+' / '+state.total;
      document.getElementById('loadDetail').textContent = detail || '首屏素材正在归位';
      window.MIRAGE_MEDIA?.updateLoad(state);
    };
    const decode = url => new Promise((resolve, reject) => {
      const img = new Image(), timer = setTimeout(() => { img.onload = img.onerror = null; reject(new Error('image timeout')); }, 25000);
      img.onload = async () => { try { if(img.decode) await img.decode(); clearTimeout(timer); resolve(); } catch(e){clearTimeout(timer);reject(e);} };
      img.onerror = () => { clearTimeout(timer); reject(new Error('image unavailable')); };
      img.src = url;
    });
    let next = 0;
    const worker = async () => {
      while(next < jobs.length){
        const j = jobs[next++];
        try {
          if(j.type === 'scene'){
            let url = U[j.key];
            if (!url){ url = await tryLoad(SRC[j.key], 6000); if(!url) throw new Error('scene unavailable'); }
            await decode(url); U[j.key] = url; ASSET_P[j.key] = Promise.resolve(url);
            if(ON_ASSET[j.key]) ON_ASSET[j.key](url);
            document.querySelectorAll('[data-src="'+j.key+'"]').forEach(img => img.src=url);
          } else if(!loadedPortraits.has(j.key)){ await decode(j.url); loadedPortraits.add(j.key); }
          state.done++; update(j.type === 'scene' ? '场景与物件 · '+j.key : '人物画卷 · '+j.key);
        } catch(e){state.failed.push(j);update('部分素材仍在等待连接');}
      }
    };
    await Promise.all(Array.from({length:2},worker));
    update();
    if(state.failed.length){
      loading=false;state.phase=state.entered?'background-error':'error';el.ldText.textContent=state.failed.length+'项素材尚未就绪';
      document.getElementById('loadDetail').textContent='保持在加载页，重试完成后再入场';
      document.getElementById('loadRetry').hidden=false;window.MIRAGE_MEDIA?.updateLoad(state);return;
    }
    loading=false;launching=true;state.phase=state.entered?'complete':'ready';el.ldText.textContent='灯火已备';
    document.getElementById('loadDetail').textContent='首屏已就绪 · 人物与地区图片按需载入';
    window.MIRAGE_MEDIA?.updateLoad(state);
    if(!state.entered){await new Promise(r=>setTimeout(r,650));enterOpening(false);}
  }
  document.getElementById('loadRetry').onclick=preloadEverything;
  window.retryBackgroundLoad=preloadEverything;
  window.MIRAGE_MEDIA.initWelcome(()=>{el.loader.classList.remove('prewelcome');preloadEverything();});

}
window.applyAsset = k => asset(k).then(u => { if (ON_ASSET[k]) ON_ASSET[k](u); document.querySelectorAll(`[data-src="${k}"]`).forEach(i => i.src = u); return u; });
</script>
